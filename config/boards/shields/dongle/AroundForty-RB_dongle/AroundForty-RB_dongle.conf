CONFIG_ZMK_KEYBOARD_NAME="AF-RB_Dongle"
#CONFIG_BT_DEVICE_NAME="AroundForty-RB" 

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_SPI=y
# CapsLEDレポート(ドッグ導入後に切替時WindosがCapsLockがONになってしまう改善対応)
CONFIG_ZMK_HID_INDICATORS=y
# Split keyboard設定（基本）
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y


CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n 
CONFIG_NANOPB=y


# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# レイヤー切り替え時に LED 表示を行う
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_BT_BAS=y

CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=3096
# 2M PHY無効：安定動作重視
CONFIG_BT_CTLR_PHY_2M=n


# ----------------------------------------
# BLE／HID／電力管理：右側と完全同期設定
# ----------------------------------------

# 最低接続間隔：7.5ms（6×1.25ms）
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6

# 最大接続間隔：15ms（12×1.25ms）
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# レイテンシ0：スキップ無しで追従安定
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# 監視タイムアウト：400（10ms単位→約4秒）
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# NKRO無効（安定性重視）
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# HKRO有効（一般的で安定）
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y

# デバウンス安定化（押下）
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3

# デバウンス安定化（離す）
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# BLE送信パワー強化：安定性向上
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# デバイス電源管理ON
CONFIG_PM_DEVICE=y

# ランタイム省電力OFF：遅延防止
CONFIG_PM_DEVICE_RUNTIME=n

# Connection Parameter Request 有効化
# Windows側への接続間隔要求が安定する
CONFIG_BT_CTLR_CONN_PARAM_REQ=y


# Bluetooth HCI TX（送信）処理用スタックサイズ（bytes）
# ホスト → コントローラへ送る BLE コマンド処理に使用
# 不足すると：
#   - ペアリング要求が送れない
#   - 接続確立直前で失敗
# 通常 1024 で十分だが、Split BLE 構成では必須
CONFIG_BT_HCI_TX_STACK_SIZE=1024


# Bluetooth ACL RX バッファサイズ（bytes）
# 接続後に受信する BLE データパケット 1個あたりの最大サイズ
# 251 = BLE の最大ペイロード（Data Length Extension 使用時）
# 小さいと：
#   - 接続はできるが通信が不安定
#   - キー入力やステータス同期が詰まる
CONFIG_BT_BUF_ACL_RX_SIZE=251


# Bluetooth ACL TX バッファサイズ（bytes）
# 接続後に送信する BLE データパケット 1個あたりの最大サイズ
# RX と同じく最大値 251 を指定しておくのが安全
# Split BLE / Status Advertisement / Battery Reporting で有効
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Bluetooth 接続上限の明示的設定
# スプリットの子機用(1) + ホスト用(5) = 計6を想定
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
